<title>SITRAMICO-ES</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: faixa de protótipo no topo, depois o site/painel em coluna única de até 1080px.
   Identidade: azul-petróleo com âmbar de sinalização (faixa zebrada de caminhão-tanque). */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#0c1226; --muted:#53607d; --line:#d6dcea;
  --brand:#173181; --on-brand:#ffffff; --accent:#faf133; --on-accent:#14120a;
  --ok:#1f7a4d; --warn:#a86400; --bad:#b3372e; --soft:#e7ebf6;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#080d1f; --surface:#101a3a; --ink:#e9edf9; --muted:#9aa7c7; --line:#223058;
    --brand:#2b4bb3; --on-brand:#ffffff; --accent:#faf133; --on-accent:#14120a;
    --ok:#56c08d; --warn:#f0b04a; --bad:#f08a80; --soft:#16224a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#080d1f; --surface:#101a3a; --ink:#e9edf9; --muted:#9aa7c7; --line:#223058;
  --brand:#2b4bb3; --on-brand:#ffffff; --accent:#faf133; --on-accent:#14120a;
  --ok:#56c08d; --warn:#f0b04a; --bad:#f08a80; --soft:#16224a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.muted{color:var(--muted)}
.small{font-size:.9rem}


/* cabeçalho */
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.01em}
.logo svg{width:30px;height:30px;flex:none}
.logo img{height:46px;width:46px;border-radius:50%;flex:none}
.nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;max-width:100%}
.nav a{white-space:nowrap;text-decoration:none;padding:7px 11px;border-radius:6px;font-weight:600;font-size:.95rem}
.nav a[aria-current="page"]{background:var(--soft)}
.zebra{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#0c0c0c 14px 28px)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.9rem}

/* blocos */
main{padding:24px 0 96px}
.nimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.wa{position:fixed;right:16px;bottom:16px;z-index:8;display:inline-flex;align-items:center;gap:8px;background:#1a9950;color:#fff;font-weight:600;text-decoration:none;padding:12px 16px;border-radius:99px;box-shadow:0 6px 18px #0004}
.hero{background:var(--brand);color:var(--on-brand);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.hero p{max-width:60ch;opacity:.92}

const IMG={};
function hidratar(){
  document.querySelectorAll("img[data-img]").forEach(el=>{
    const id=el.dataset.img,adm=el.dataset.adm==="1"; if(!id)return;
    const k=(adm?"a":"p")+id;
    if(!IMG[k])IMG[k]=api(adm?"noticiaImagem":"imagem",{id},adm?"adm":undefined).then(r=>r.dataUrl);
    IMG[k].then(u=>{el.src=u}).catch(()=>el.remove());
  });
}
const lerB64=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>er(new Error("Não foi possível ler o arquivo."));r.readAsDataURL(f)});
function reduzirImagem(file,max,mime,q){return new Promise((ok,er)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");if(mime==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL(mime,q))};
  im.onerror=()=>er(new Error("Não foi possível ler a imagem. Use JPG ou PNG."));im.src=u})}
async function prepararArquivo(file){
  if(file.type==="application/pdf"){ if(file.size>8*1024*1024)throw new Error("PDF acima de 8 MB. Reduza o arquivo e tente de novo."); return {nome:file.name,mime:file.type,b64:await lerB64(file)}; }
  if(file.type.startsWith("image/")){ const d=await reduzirImagem(file,1600,"image/jpeg",.82); return {nome:file.name.replace(/\.\w+$/,"")+".jpg",mime:"image/jpeg",b64:d.split(",")[1]}; }
  throw new Error("Use PDF ou imagem (JPG ou PNG).");
}
const reduzirImagemArq=async f=>{const d=await reduzirImagem(f,600,"image/png");if(d.length>1.4e6)return {nome:f.name.replace(/\.\w+$/,"")+".jpg",mime:"image/jpeg",b64:(await reduzirImagem(f,600,"image/jpeg",.85)).split(",")[1]};return {nome:f.name.replace(/\.\w+$/,"")+".png",mime:"image/png",b64:d.split(",")[1]}};
const arquivoDe=id=>{const e=document.getElementById(id);return e&&e.files&&e.files[0]||null};
function baixar(a){
  const bin=atob(a.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:a.mime})),l=document.createElement("a");
  l.href=url;l.download=a.nome;l.target="_blank";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

const FAQ=[
 ["O que é Convenção Coletiva de Trabalho?","Trata-se de um acordo entre o sindicato dos trabalhadores e sindicato patronal para definir normas que disponham sobre as condições de trabalho da categoria, como pisos salariais, jornada de trabalho, benefícios. Geralmente coisas que estão além da CLT. Conforme define o artigo 611 da CLT, a convenção coletiva de trabalho é o acordo de caráter normativo, pelo qual dois ou mais sindicatos representativos de categorias econômicas e profissionais estipulam condições de trabalho aplicáveis, no âmbito das respectivas representações, às relações individuais de trabalho. Os direitos previstos na convenção coletiva têm a mesma força das normas da CLT."],
 ["O que é Acordo Coletivo de Trabalho?","É um acordo realizado entre o sindicato dos trabalhadores e uma determinada empresa. Assim como na CCT, no ACT são definidas normas que disponham sobre as condições de trabalho da categoria, como pisos salariais, jornada de trabalho, benefícios."],
 ["O empregado que se afastar por motivo de doença, tem o direito de correção salarial igual àquela obtida por outros funcionários, após seu retorno ao trabalho?","Sim, terminado o período de afastamento por motivo de doença, cabe ao funcionário retornar imediatamente ao trabalho e ele também fará juz à correção salarial igual à obtida por outros funcionários durante o seu afastamento."],
 ["Qual é o prazo para pagamento da remuneração das férias e abono solicitados?","Com a Reforma Trabalhista, o benefício das férias pode ser dividido em três períodos, sendo que um deles não pode ser inferior a 14 dias. O pagamento da remuneração das férias e do abono será efetuado até dois dias antes do início do respectivo período."],
 ["Quantas vezes o empregado pode faltar ao serviço sem perder o direito às férias?","As faltas justificadas são abonadas. Caso hajam faltas não justificadas as férias serão proporcionais. O artigo 130 detalha as regras das férias CLT e todos os direitos do colaborador levando em conta também as faltas do colaborador. Art. 130. Após cada período de 12 (doze) meses de vigência do contrato de trabalho, o empregado terá direito a férias, na seguinte proporção:<br>I – 30 (trinta) dias corridos, quando não houver faltado ao serviço mais de 5 (cinco) vezes;<br>II – 24 (vinte e quatro) dias corridos quando houver tido 6 (seis) a 14 (quatorze) faltas;<br>III – 18 (dezoito) dias corridos, quando houver tido de 15 (quinze) a 23 (vinte e três) faltas;<br>IV – 12 (doze) dias corridos, quando houver tido de 24 (vinte e quatro) a 32 (trinta e duas) faltas."],
 ["Em que hipóteses o empregado pode deixar de comparecer ao serviço, sem prejuízo do salário?","O artigo 473 da CLT apresenta determinadas situações em que não pode haver desconto do salário:<br><b>a)</b> Falecimento do cônjuge, ascendente, descendente, irmão ou pessoa que viva sob dependência econômica do empregado conforme declarado em sua CTPS: até 2 (dois) dias consecutivos;<br><b>b)</b> Em virtude de casamento: até 3 (três) dias consecutivos;<br><b>c)</b> Licença-paternidade: 5 (cinco) dias;<br><b>d)</b> Doação voluntária de sangue devidamente comprovada: 1 (um) dia a cada 12 (doze) meses;<br><b>e)</b> Alistamento eleitoral: até 2 (dois) dias consecutivos ou não;<br><b>f)</b> Serviço militar, durante o tempo em que tiver de cumprir as suas exigências;<br><b>g)</b> Nos dias em que estiver realizando exame vestibular para ingresso no ensino superior;<br><b>h)</b> Quando tiver de comparecer em juízo, durante o tempo em que for necessário;<br><b>i)</b> Aborto não criminoso: 2 (duas) semanas;<br><b>j)</b> Quando, na qualidade de representante de entidade sindical, estiver participando de reunião oficial de organismo internacional do qual o Brasil seja membro, pelo tempo que se fizer necessário;<br><b>k)</b> Acompanhamento de consultas médicas e exames complementares durante o período de gravidez de sua esposa ou companheira: até 2 (dois) dias;<br><b>l)</b> Acompanhamento de filho de até 6 (seis) anos em consulta médica: 01 (um) dia por ano; (Para os empregados em condomínios residenciais, comerciais ou misto, de São Paulo, a Convenção Coletiva prevê que “as faltas ou horas não trabalhadas do empregado que necessitar assistir seus filhos menores de 14 (catorze) anos em médicos, desde que o fato resulte devidamente comprovado, posteriormente, através de atestado médico e no máximo 3 (três) vezes em cada 12 (doze) meses”, ampliando as hipóteses de falta sem comprometimento do salário). Outras situações: Afastamento por doença: pelo tempo em que perdurar a doença. Em caso de afastamento superior a 15 (quinze) dias, o empregador é responsável pelo salário nestes primeiros 15 (quinze) dias e a partir do 16º (décimo sexto) o pagamento ocorrerá por conta da Previdência Social, desde que, constatada a incapacidade do empregado em perícia médica."],
 ["Quantas horas de descanso deve haver entre uma jornada de trabalho e outra?","Trata-se de intervalo Inter jornada que não se confunde com o intervalo para refeição e descanso, que deve ser de no mínimo de 1 hora para jornadas superiores a 6 horas. Entre duas jornadas de trabalho haverá um período mínimo de 11 (onze) horas consecutivas para descanso."],
 ["Qual a duração da jornada de trabalho?","Em geral a duração da jornada conforme CLT é de 44 horas por semana e 220 horas por mês. Podendo variar de acordo com a categoria ou CCT / ACT vigente."]
];

const HOMO=[["Quais são os documentos necessários?","<p>• TRCT – Termo de TRCT – Termo de Rescisão de Contrato de Trabalho – em 05 vias;</p><p>• Aviso Prévio assinado pelo empregado e empregador em 03 vias;</p><p>• Atestado Médico Demissional em 03 vias (APTO);</p><p>• Guias de Seguro Desemprego (CD/SD) – formulário constando o CPF do empregado;</p><p>• GRFC quitada (guia de recolhimento rescisório do FGTS – 50%) – em 03 vias;</p><p>• GFIP´s que não constarem no extrato analítico do FGTS – em 03 vias;</p><p>• Extrato analítico do FGTS da CEF (atualizado) – em 03 vias;</p><p>• Livro ou ficha de registro dos empregados;</p><p>• CTPS do empregado com a devida baixa e atualizada;</p><p>• PPP – Perfil Profissiográfico Previdenciário – em 03 vias;</p><p>• Carta de preposto;</p><p>• 03 últimos comprovantes de pagamento;</p><p>• 03 últimos comprovantes de pagamento da contribuição sindical, confederativa e assistencial.</p><p>• O pagamento deve ser feito em DINHEIRO, CHEQUE ADMINISTRATIVO ou DEPÓSITO NA CONTA POUPANÇA OU CONTA SALÁRIO DO EMPREGADO</p><p><b>• Obs.: se o empregado pede demissão, ele não recebe os 40% da multa, não pode retirar o FGTS e não recebe Seguro Desemprego.</b></p>"],

const pubQuemSomos=()=>`${pgTitulo("Quem somos")}<div class="o-wrap o-sec o-txt"><p>No dia 08 de janeiro de 1960, foi fundado associação de classe, na conformidade da “consolidação das leis do trabalho”. Posteriormente foi efetuado a transformação dessa associação em sindicato, para que a nova coletividade trabalhista, local, possa ter sua entidade jurídica capacitada a representa-la no trato de nossos interesses gerais, entre os quais vale citar:</p>
 <p>Defesa das causas coletivas ou individuais dos associados relativas a atividade ou profissão exercida; Celebrar contratos coletivos de trabalho, inclusive de reajuste salarial; Colaborar com o estado, como órgão técnico e consultivo, no estudo e solução dos problemas que se relacionam com a respectiva categoria profissional.</p>
 <p>Os princípios que orientam o SITRAMICO são a defesa dos interesses dos trabalhadores, com democracia e participação destes nas ações do Sindicato. Autonomia frente ao Estado, classe patronal, partidos políticos, credos religiosos e filosóficos, bem como, promover a solidariedade entre os trabalhadores e lutar pela justiça social e pela extinção da exploração do homem pelo homem.</p>
 <p>O SITRAMICO tem por objetivo defender todos os interesses da categoria e assegurar, por todos os meios, o cumprimento dos direitos dos trabalhadores, principalmente, os de proteção ao trabalho e preservação da saúde. Também lutará sempre por uma remuneração justa, promovendo a união, organização e educação nos princípios da solidariedade de classe. O incentivo à organização dos trabalhadores nos locais de trabalho é uma bandeira permanente e constante deste Sindicato. Por tudo isso que o nosso slogan é ' SITRAMICO - Sempre na Luta</p>
 <p>O Sindicato dos Trabalhadores no Comércio de Minérios e Derivados de Petróleo no Estado do Espírito Santo – SITRAMICO (inclusive pesquisa de minérios) abrange os trabalhadores empregados no comércio varejista de combustíveis e lubrificantes,empresas de lavagem (lava jato),lubrificação e troca de óleo de veículos,distribuição revenda e comércio de gás liquefeito de petróleo,comércio transportador revendedor retalhista de óleo diesel,óleo combustível e querosene,no comércio e pesquisa de minérios e empregados em atividades econômicas similares ou conexas,com abrangência ESTADUAL e base territorial ao estado do espírito santo,com base legal na portaria nº 343/00,publicada no D.O.U de 22/11/2000,seção I.p.22.</p>

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&A[el.dataset.act])A[el.dataset.act](el.dataset.id,el)});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(F[f.dataset.form])F[f.dataset.form](new FormData(f),f,e.submitter)});
document.addEventListener("input",e=>{if(e.target.dataset.input==="busca"){S.busca=e.target.value;recarregarLista()}});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.change;if(!k)return;
 if(k==="filtro"){S.filtro=t.value;recarregarLista()}
 else if(k==="status")agir(async()=>{await api("assocStatus",{id:S.ficha,status:t.value},"adm");await carregarAdmin();render();toast("Situação atualizada.")});
 else if(k==="cartSel"){S.cartSel=t.value;render()}
 else if(k==="mes"){S.mes=+t.value;render()}
 else if(k==="anexo"&&t.files[0])agir(async()=>{const arq=await prepararArquivo(t.files[0]);await api("anexoUpload",{assocId:S.ficha,arq},"adm");await carregarAdmin();render();toast("Arquivo anexado à ficha.")});
});
async function retomar(){
 if(rota()==="admin"&&sessionStorage.getItem("sit_adm")&&!S.A){try{await carregarAdmin()}catch(e){}}
 if(rota()==="associado"&&sessionStorage.getItem("sit_soc")){render();try{await carregarSocio()}catch(e){if(e.message==="SESSAO")return}}
 else if(["inicio","parceiros","noticias"].includes(rota())&&Date.now()-(S.pubEm||0)>60000){try{await carregarPublico()}catch(e){}}
 render();
}
addEventListener("hashchange",async()=>{S.confirma="";S.menu=false;S.formOk="";if(hashBase()!=="contato"){S.contatoOk=null;if(S.assuntoPre&&hashBase()!=="contato")S.assuntoPre=""}await retomar();if(!irAncora())scrollTo(0,0)});
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(a&&a.getAttribute("href")==="#"+location.hash.replace("#","")&&ANC[hashBase()]){e.preventDefault();irAncora()}});
(async function(){
 render();
 try{await carregarPublico()}catch(e){S.erroPub=e.message}
 S.carregando=false;
 await retomar();
 if(ANC[hashBase()])setTimeout(irAncora,150);
})();
</script>
